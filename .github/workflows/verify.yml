name: Verify repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, am 2026-09-08 gegen das offizielle Release geprüft.
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Offizielle Ubuntu-TeX-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            biber \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-extra \
            texlive-pictures \
            texlive-plain-generic

      - name: Gemeinsamen Verify-Vertrag ausführen
        run: bash scripts/verify-repo.sh --require-latex

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Git-for-Windows-Standard ausdrücklich setzen: Zeilenenden werden beim
      # Auschecken umgewandelt, sofern .gitattributes nichts anderes festlegt.
      - name: Windows-Standard core.autocrlf=true setzen
        run: |
          git config --global core.autocrlf true
          echo "core.autocrlf=$(git config --global --get core.autocrlf)"

      # actions/checkout v7.0.1, derselbe gepinnte Commit wie im Ubuntu-Job.
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Zeilenenden der gesperrten Dateien anzeigen
        run: git ls-files --eol examples/onboarding-assistant/data examples/onboarding-assistant/evals examples/onboarding-assistant/runs

      # Ohne LaTeX-Toolchain; der Build-Schritt meldet einen sichtbaren Skip.
      - name: Gemeinsamen Verify-Vertrag ohne LaTeX ausführen
        run: bash scripts/verify-repo.sh
